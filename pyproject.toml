[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading_unam"
version = "0.2.0"
description = "Trading UNAM: Paquete de optimización de portafolios, analítica técnica y gestión de riesgo financiero."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Equipo Python FE", email = "alfredo.olguin@economia.unam.mx"}
]
maintainers = [
  {name = "Equipo Python FE", email = "alfredo.olguin@economia.unam.mx"}
]
keywords = [
  "finance",
  "portfolio-optimization",
  "markowitz",
  "var",
  "cvar",
  "monte-carlo",
  "quantitative-finance",
  "yfinance",
  "financial-analytics",
  "trading-unam",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "yfinance>=0.2.30",
  "scikit-learn>=1.2.0",
  "matplotlib>=3.7.0",
  "scipy>=1.10.0",
  "typer>=0.9.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "coverage",
  "mypy",
  "ruff",
  "build",
  "twine",
]
nlp = [
  "transformers>=4.30.0",
  "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/alfredo203/trading_unam"
Repository = "https://github.com/alfredo203/trading_unam"
"Bug Tracker" = "https://github.com/alfredo203/trading_unam/issues"
Documentation = "https://github.com/alfredo203/trading_unam#readme"

[project.scripts]
trading-unam = "trading_unam.cli:main"
opt-pyfe = "trading_unam.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]
