name: Publicar en PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Necesario para Trusted Publishing de PyPI
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de compilación y pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest
          python -m pip install -e .

      - name: Ejecutar pruebas unitarias
        run: |
          pytest -v

      - name: Construir sdist y wheel
        run: |
          python -m build

      - name: Verificar archivos con Twine
        run: |
          twine check dist/*

      - name: Publicar paquete en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
